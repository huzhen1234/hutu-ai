spring:
  application:
    name: hutu-ai
#    AI配置
  ai:
    ollama:
      base-url: http://192.168.1.19:11434
      chat:
        model: deepseek-r1:7b
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: qwen-max # 模型名称，可更改 https://help.aliyun.com/zh/model-studio/getting-started/models
          temperature: 0.8 # 模型温度，值越大，输出结果越随机
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.19:3306/spring_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
# SimpleLoggerAdvisor 日志
logging:
  level:
    org.springframework.ai.chat.client.advisor: debug
    hutu.com: debug
